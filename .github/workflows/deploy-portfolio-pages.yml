name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-portfolio-pages.yml"
      - "docs/portfolio/assets/**"
      - "docs/portfolio/site/**"
      - "public/icons/icon-logo.png"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio site
        shell: bash
        run: |
          mkdir -p _site/assets
          cp docs/portfolio/site/index.html _site/index.html
          cp docs/portfolio/site/styles.css _site/styles.css
          cp docs/portfolio/assets/*.webp _site/assets/
          cp public/icons/icon-logo.png _site/icon-logo.png
          sed -i 's#\.\./assets/#./assets/#g' _site/index.html
          sed -i 's#\.\./\.\./\.\./public/icons/icon-logo.png#./icon-logo.png#g' _site/index.html
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
